<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Orders</title>
    <script th:src="@{/js/orders.js}" defer></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Manage Orders</h1>
    <nav aria-label="Main navigation">
        <a th:href="@{/}">Home</a> |
        <a th:href="@{/sellers}">Sellers</a> |
        <a th:href="@{/products}">Products</a>
    </nav>
</header>

<main id="order-page" th:attr="data-api=@{/api/orders}">
    <h2 id="form-title">Create order</h2>
    <p id="message" role="status"></p>

    <form id="order-form">
        <input type="hidden" name="id">

        <p>
            <label for="customerName">Customer name</label>
            <input id="customerName" name="customerName" required>
        </p>

        <p>
            <label for="customerEmail">Customer email</label>
            <input id="customerEmail" name="customerEmail"
                   type="email" required>
        </p>

        <p>
            <label for="productId">Product ID</label>
            <input id="productId" name="productId" type="number"
                   min="1" step="1" required>
        </p>

        <p>
            <label for="quantity">Quantity</label>
            <input id="quantity" name="quantity" type="number"
                   min="1" step="1" value="1" required>
        </p>

        <p>Product and quantity cannot be changed after creation.</p>

        <p>
            <label for="orderStatus">Order status</label>
            <select id="orderStatus" name="orderStatus">
                <option>Pending</option>
                <option>Confirmed</option>
                <option>Shipped</option>
                <option>Delivered</option>
            </select>
        </p>

        <button type="submit">Save order</button>
        <button type="button" id="clear-form">Clear form</button>
    </form>

    <h2>Order list</h2>
    <p>Deleting an order removes its record without restoring stock.</p>
    <button type="button" id="refresh">Refresh list</button>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Email</th>
            <th>Product ID</th>
            <th>Quantity</th>
            <th>Status</th>
            <th>Order time</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="order-rows"></tbody>
    </table>
</main>
</body>
</html>

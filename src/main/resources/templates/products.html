<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Products</title>
    <script th:src="@{/js/products.js}" defer></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Manage Products</h1>
    <nav aria-label="Main navigation">
        <a th:href="@{/}">Home</a> |
        <a th:href="@{/sellers}">Sellers</a> |
        <a th:href="@{/orders}">Orders</a>
    </nav>
</header>

<main id="product-page" th:attr="data-api=@{/api/products}">
    <h2 id="form-title">Create product</h2>
    <p id="message" role="status"></p>

    <form id="product-form">
        <input type="hidden" name="id">

        <p>
            <label for="productName">Product name</label>
            <input id="productName" name="productName" required>
        </p>

        <p>
            <label for="category">Category</label>
            <input id="category" name="category" required>
        </p>

        <p>
            <label for="price">Price</label>
            <input id="price" name="price" type="number"
                   min="0.01" step="0.01" required>
        </p>

        <p>
            <label for="stockQuantity">Stock quantity</label>
            <input id="stockQuantity" name="stockQuantity" type="number"
                   min="0" step="1" required>
        </p>

        <p>
            <label for="availability">Available for purchase</label>
            <input id="availability" name="availability"
                   type="checkbox" checked>
        </p>

        <p>
            <label for="sellerId">Seller ID</label>
            <input id="sellerId" name="sellerId" type="number"
                   min="1" step="1" required>
        </p>

        <button type="submit">Save product</button>
        <button type="button" id="clear-form">Clear form</button>
    </form>

    <h2>Product list</h2>
    <button type="button" id="refresh">Refresh list</button>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Available</th>
            <th>Seller ID</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="product-rows"></tbody>
    </table>
</main>
</body>
</html>
